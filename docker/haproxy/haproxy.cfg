global
  log stdout format raw local0
defaults
  mode tcp
  timeout connect 5s
  timeout client 1h
  timeout server 1h
frontend postgres_writer
  bind :5432
  default_backend patroni_primary
frontend postgres_replica
  bind :5433
  default_backend patroni_replicas
backend patroni_primary
  default-server init-addr libc,none
  option httpchk GET /primary
  http-check expect status 200
  server pg1 postgres1:5432 check port 8008
  server pg2 postgres2:5432 check port 8008
  server pg3 postgres3:5432 check port 8008
backend patroni_replicas
  default-server init-addr libc,none
  option httpchk GET /replica
  http-check expect status 200
  server pg1 postgres1:5432 check port 8008
  server pg2 postgres2:5432 check port 8008
  server pg3 postgres3:5432 check port 8008
