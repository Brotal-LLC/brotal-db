[databases]
* = host=postgres port=5432
penpot = host=postgres port=5432 dbname=penpot pool_size=140 reserve_pool_size=20 max_db_connections=180
zabbix = host=postgres port=5432 dbname=zabbix pool_size=100 reserve_pool_size=20 max_db_connections=120

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6433
unix_socket_dir = /var/run/pgbouncer
pidfile = /var/run/pgbouncer/pgbouncer.pid
logfile =
pool_mode = session
max_client_conn = 1200
default_pool_size = 40
reserve_pool_size = 10
reserve_pool_timeout = 5
max_db_connections = 220
query_wait_timeout = 30
server_connect_timeout = 5
client_login_timeout = 15
server_login_retry = 3
server_check_delay = 10
server_check_query = select 1
server_lifetime = 3600
server_idle_timeout = 300
auth_type = hba
auth_hba_file = /etc/pgbouncer/pgbouncer-hba.conf
auth_file = /run/secrets/pgbouncer_userlist
auth_user = pgbouncer_auth
auth_query = SELECT * FROM pgbouncer.get_auth($1)
auth_dbname = postgres
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats
ignore_startup_parameters = extra_float_digits
application_name_add_host = 1
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
