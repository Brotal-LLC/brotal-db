global
    log stdout format raw local0
    maxconn 1200
    stats socket /var/run/haproxy/admin.sock mode 660 level admin

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 30m
    timeout server 30m
    timeout check 3s

frontend postgresql_write
    bind :6432
    mode tcp
    default_backend patroni_primary

backend patroni_primary
    mode tcp
    option httpchk
    http-check connect port 8008
    http-check send meth GET uri /primary ver HTTP/1.1 hdr host patroni
    http-check expect status 200
    http-check connect port 6433
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server armadillo 100.64.0.5:6433 check
    server rogue 100.64.0.4:6433 check
    server fluffy 100.64.0.2:6433 check
