---
name: postgres-ha-existing-data-lab

x-legacy: &legacy
  image: postgres-ha-patroni:existing-data-test
  user: "999:999"
  restart: "no"
  entrypoint: [/usr/local/bin/docker-entrypoint.sh]
  environment:
    PGDATA: /var/lib/postgresql/data
  healthcheck:
    test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
    interval: 2s
    timeout: 3s
    retries: 60

x-adoption: &adoption
  image: postgres-ha-patroni:existing-data-test
  user: "999:999"
  restart: "no"
  entrypoint: [/usr/local/bin/patroni-existing-data-entrypoint]
  profiles: [adoption]
  environment:
    PGDATA: /var/lib/postgresql/data
    PATRONI_EXISTING_DATA_CONFIG: /config/patroni.yml
    PATRONI_EXISTING_DATA_START_TIMEOUT: "120"
  volumes:
    - type: bind
      source: ${LAB_SECRETS_DIR:-/tmp/postgres-ha-existing-render-secrets}
      target: /run/secrets
      read_only: true
    - type: bind
      source: ./legacy/postgresql.conf
      target: /etc/postgresql/postgresql.conf
      read_only: true
    - type: bind
      source: ./legacy/pg_hba.conf
      target: /etc/postgresql/pg_hba.conf
      read_only: true

x-steady: &steady
  image: postgres-ha-patroni:existing-data-test
  user: "999:999"
  restart: "no"
  profiles: [adoption]
  environment:
    PGDATA: /var/lib/postgresql/data

services:
  etcd:
    image: >-
      gcr.io/etcd-development/etcd:v3.7.1@sha256:a9983dd6d9283138ab926daa307c6c25623636703ecf5645d5df4d666ce9eba2
    user: "1000:1000"
    restart: "no"
    read_only: true
    tmpfs:
      - /var/lib/etcd:rw,uid=1000,gid=1000,mode=0700
    command:
      - /usr/local/bin/etcd
      - --name=existing-data-lab
      - --data-dir=/var/lib/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://127.0.0.1:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=existing-data-lab=http://127.0.0.1:2380
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/etcdctl
        - --endpoints=http://127.0.0.1:2379
        - endpoint
        - health
      interval: 2s
      timeout: 3s
      retries: 30

  armadillo-net:
    image: >-
      alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    user: "1000:1000"
    restart: "no"
    read_only: true
    hostname: armadillo
    command: [sleep, infinity]

  rogue-net:
    image: >-
      alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    user: "1000:1000"
    restart: "no"
    read_only: true
    hostname: rogue
    command: [sleep, infinity]

  fluffy-net:
    image: >-
      alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    user: "1000:1000"
    restart: "no"
    read_only: true
    hostname: fluffy
    command: [sleep, infinity]

  armadillo-legacy:
    <<: *legacy
    network_mode: service:armadillo-net
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - armadillo-data:/var/lib/postgresql
      - ${LAB_SECRETS_DIR:-/tmp/postgres-ha-existing-render-secrets}:/run/secrets:ro
      - ./legacy/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./legacy/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./legacy/init-existing-primary.sh:/docker-entrypoint-initdb.d/10-existing-primary.sh:ro

  rogue-legacy:
    <<: *legacy
    network_mode: service:rogue-net
    entrypoint: [/lab/legacy-replica.sh]
    environment:
      PGDATA: /var/lib/postgresql/data
      LEGACY_NODE_NAME: rogue
      PRIMARY_HOST: armadillo-net
    depends_on:
      armadillo-legacy:
        condition: service_healthy
    volumes:
      - rogue-data:/var/lib/postgresql
      - ${LAB_SECRETS_DIR:-/tmp/postgres-ha-existing-render-secrets}:/run/secrets:ro
      - ./legacy/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./legacy/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./legacy/legacy-replica.sh:/lab/legacy-replica.sh:ro

  fluffy-legacy:
    <<: *legacy
    network_mode: service:fluffy-net
    entrypoint: [/lab/legacy-replica.sh]
    environment:
      PGDATA: /var/lib/postgresql/data
      LEGACY_NODE_NAME: fluffy
      PRIMARY_HOST: armadillo-net
    depends_on:
      armadillo-legacy:
        condition: service_healthy
    volumes:
      - fluffy-data:/var/lib/postgresql
      - ${LAB_SECRETS_DIR:-/tmp/postgres-ha-existing-render-secrets}:/run/secrets:ro
      - ./legacy/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./legacy/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./legacy/legacy-replica.sh:/lab/legacy-replica.sh:ro

  armadillo-patroni:
    <<: *adoption
    network_mode: service:armadillo-net
    environment:
      PGDATA: /var/lib/postgresql/data
      PATRONI_EXISTING_DATA_CONFIG: /config/patroni.yml
      PATRONI_EXISTING_DATA_EXPECT_ROLE: primary
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - armadillo-data:/var/lib/postgresql
      - ./patroni/armadillo.yml:/config/patroni.yml:ro
      - ${LAB_SECRETS_DIR:-/tmp/postgres-ha-existing-render-secrets}:/run/secrets:ro
      - ./legacy/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./legacy/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

  rogue-patroni:
    <<: *adoption
    network_mode: service:rogue-net
    environment:
      PGDATA: /var/lib/postgresql/data
      PATRONI_EXISTING_DATA_CONFIG: /config/patroni.yml
      PATRONI_EXISTING_DATA_EXPECT_ROLE: replica
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - rogue-data:/var/lib/postgresql
      - ./patroni/rogue.yml:/config/patroni.yml:ro
      - ${LAB_SECRETS_DIR:-/tmp/postgres-ha-existing-render-secrets}:/run/secrets:ro
      - ./legacy/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./legacy/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

  fluffy-patroni:
    <<: *adoption
    network_mode: service:fluffy-net
    environment:
      PGDATA: /var/lib/postgresql/data
      PATRONI_EXISTING_DATA_CONFIG: /config/patroni.yml
      PATRONI_EXISTING_DATA_EXPECT_ROLE: replica
    depends_on:
      etcd:
        condition: service_healthy
    volumes:
      - fluffy-data:/var/lib/postgresql
      - ./patroni/fluffy.yml:/config/patroni.yml:ro
      - ${LAB_SECRETS_DIR:-/tmp/postgres-ha-existing-render-secrets}:/run/secrets:ro
      - ./legacy/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./legacy/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

  armadillo-steady:
    <<: *steady
    network_mode: service:armadillo-net
    volumes:
      - armadillo-data:/var/lib/postgresql
      - ./patroni/armadillo.yml:/etc/patroni/patroni.yml:ro
      - ${LAB_SECRETS_DIR:-/tmp/postgres-ha-existing-render-secrets}:/run/secrets:ro

  rogue-steady:
    <<: *steady
    network_mode: service:rogue-net
    volumes:
      - rogue-data:/var/lib/postgresql
      - ./patroni/rogue.yml:/etc/patroni/patroni.yml:ro
      - ${LAB_SECRETS_DIR:-/tmp/postgres-ha-existing-render-secrets}:/run/secrets:ro

  fluffy-steady:
    <<: *steady
    network_mode: service:fluffy-net
    volumes:
      - fluffy-data:/var/lib/postgresql
      - ./patroni/fluffy.yml:/etc/patroni/patroni.yml:ro
      - ${LAB_SECRETS_DIR:-/tmp/postgres-ha-existing-render-secrets}:/run/secrets:ro

volumes:
  armadillo-data:
  rogue-data:
  fluffy-data:
