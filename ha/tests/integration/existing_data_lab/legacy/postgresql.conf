listen_addresses = '*'
port = 5432
max_connections = 100
shared_buffers = 128MB
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 256MB
wal_log_hints = on
hot_standby = on
hot_standby_feedback = on
password_encryption = scram-sha-256
logging_collector = off
log_destination = 'stderr'
