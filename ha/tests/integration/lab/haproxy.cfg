global
    log stdout format raw local0
    maxconn 100
    stats socket ipv4@127.0.0.1:9999 level admin

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    timeout check 2s

frontend postgresql_write
    bind :6432
    default_backend patroni_primary

backend patroni_primary
    option httpchk
    http-check connect port 8008
    http-check send meth GET uri /primary ver HTTP/1.1 hdr host patroni
    http-check expect status 200
    http-check connect port 6433
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server armadillo armadillo:6433 check init-addr last,libc,none
    server rogue rogue:6433 check init-addr last,libc,none
    server fluffy fluffy:6433 check init-addr last,libc,none
